spring:
  datasource:
    url: jdbc:h2:mem:recruitment
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    secret: mySecretKeyForJWTTokenGenerationMustBe256BitsLongEnough12345
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: DEBUG
