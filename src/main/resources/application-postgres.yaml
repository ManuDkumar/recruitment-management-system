spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/recruitment}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:recruitment}
    password: ${DB_PASSWORD:recruitment}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
